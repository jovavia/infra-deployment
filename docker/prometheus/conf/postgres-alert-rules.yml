groups:
  - name: postgres.rules

    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL instance is down"

      - alert: PostgreSQLTooManyConnections
        expr: pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above threshold"

  - name: pgbouncer.rules

    rules:
      - alert: PgBouncerDown
        expr: pgbouncer_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PgBouncer is unavailable"

      - alert: PgBouncerPoolSaturation
        expr: pgbouncer_pools_client_waiting_connections > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Clients are waiting for PgBouncer connections"