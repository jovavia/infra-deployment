name: Jovavia Infrastructure CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment
        run: cp .env.example .env

      - name: Validate root Docker Compose
        run: docker compose --env-file .env config

  validate-configs:
    name: Validate Infrastructure Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment
        run: cp .env.example .env

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v ${{ github.workspace }}/docker/prometheus/conf:/etc/prometheus \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v ${{ github.workspace }}/docker/prometheus/conf:/etc/prometheus \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/postgres-alert-rules.yml

      - name: Validate Grafana provisioning YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: docker/grafana/provisioning

  shellcheck:
    name: Shell Script Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts ./docker

  markdownlint:
    name: Markdown Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: .markdownlint.json
          globs: |
            README.md
            docs/**/*.md